spring:
  application:
    name: boardKitApi

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 55MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}

boardkit:
  file:
    storage-root: ${FILE_STORAGE_ROOT:./store}
    max-file-count: 20
    max-file-size: 20MB
    max-post-size: 50MB
    orphan-minimum-age: 24h

  file-cleanup:
    interval: PT1M
    orphan-scan-interval: PT6H
    orphan-scan-initial-delay: PT1M

  auth:
    cookie-secure: false